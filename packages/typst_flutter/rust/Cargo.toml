[package]
name = "typst_flutter"
version = "2.2.1"
edition = "2024"
description = "Native Typst typesetting compiler for Flutter via Rust FFI"
license = "Apache-2.0"

[lib]
name = "typst_flutter"
crate-type = ["cdylib", "staticlib"]

[dependencies]
typst = "0.15.0"
typst-pdf = "0.15.0"
typst-render = "0.15.0"
typst-svg = "0.15.0"
typst-eval = "0.15.0"
serde_json = "1.0"
typst-layout = "0.15.0"
typst-utils = "0.15.0"
comemo = "0.5.1"
flutter_rust_bridge = "=2.12.0"
time = "0.3.47"
tylog_import_core = { path = "../../tylog_import_core" }

# ponytail: ort prebuilts cover arm64 Android and Apple-silicon macOS only;
# other targets (x86 Android, the universal build's x86_64 slice) get the stub.
[target.'cfg(any(all(target_os = "android", target_arch = "aarch64"), all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.13", features = ["ndarray", "download-binaries"] }
tokenizers = "0.23.2"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "z"      # optimise for binary size
lto = "thin"         # cross-crate link-time optimisation (smaller binaries)
codegen-units = 1    # maximum intra-crate optimisation (thin LTO handles parallelism)
strip = true         # strip debug symbols from the output
panic = "abort"      # smaller binary: no unwinding tables

[features]
p2p-harness = ["dep:iroh", "dep:tokio", "dep:jni", "dep:sha2"]

[dependencies.iroh]
version = "1.4.0"
optional = true
default-features = false
features = ["tls-ring"]

[dependencies.tokio]
version = "1"
optional = true
features = ["rt-multi-thread", "time"]

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", optional = true }

[dependencies.sha2]
version = "0.10"
optional = true
