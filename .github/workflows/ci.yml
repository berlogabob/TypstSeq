name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - uses: typst-community/setup-typst@6a2cfaf0b28d636b00148f965e315bae81079aaa # v5
        with:
          typst-version: 0.15.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/tylog_import_core/target
            packages/typst_flutter/rust/target
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('packages/tylog_import_core/Cargo.lock', 'packages/typst_flutter/rust/Cargo.lock') }}
          restore-keys: cargo-ci-${{ runner.os }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: packages/typst_flutter/.typst_flutter_prebuilt
          # Must include rust/, or a Rust edit reuses a cache built before it. The
          # old key hashed only pubspec.yaml, whose version line has never changed.
          key: prebuilt-${{ runner.os }}-${{ hashFiles('packages/typst_flutter/pubspec.yaml', 'packages/typst_flutter/rust/**') }}
      # Analysis and tests never load the native library, so skip the Rust build
      # here. The release jobs build it and assert the result.
      - run: TYLOG_SKIP_SOURCE_BUILD=1 ./tool/setup_typst_native.sh
      - run: make test-typst
      - run: make test-core
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      # The transcribe worker tests cut audio with ffmpeg.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv run --with pytest pytest tool -q
      - run: flutter analyze
      - run: flutter test
